name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Regenerate dataset and check it is reproducible
        run: |
          python generate_invoices.py --out data/invoices.jsonl
          git diff --exit-code -- data/invoices.jsonl

      - name: Validate the generated dataset
        run: python solve.py data/invoices.jsonl report.jsonl

      - name: Build the Docker image
        run: docker build -t gst-validator .
